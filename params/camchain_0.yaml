%YAML:1.0
cam_overlaps: []
camera_model: "pinhole"
focal: 699.070687
D: [-0.02593676, -0.0028158, 0.0539843, 0.00725391, -0.00059307]
KMat: !!opencv-matrix
    rows:3
    cols:3
    dt:d
    data:[699.070687, 0, 1212.06739, 0, 712.670709, 260.423873, 0, 0, 1]
distortion_model: radtan
RMat: !!opencv-matrix
    rows: 3
    cols: 3
    dt: f
    data: [1, 0, 0, 0, 1, 0, 0, 0, 1]
EYEMat: !!opencv-matrix
    rows:3
    cols:3
    dt:u
    data:[1,0,0,0,1,0,0,0,1]
# 注: K flat 顺序 [fx, 0, fy, 0, cx, cy, 0, 0, 1] 仅供肉眼阅读, loader 不读.
#      v3.x.3 (2026-07-09): 单 cam 内参覆盖, 没有相对 cam0 的外参, RMat 给单位阵;
#      外参走 ba_estimator 在运行时从图像估. cy=260.42 离 1440/2=720 偏 460px,
#      fx=699 远小于其他 cam (1800-2100), 主点 + 焦距异常, 见 commit message 警告.
K: [699.070687, 0, 712.670709, 0, 1212.06739, 260.423873, 0, 0, 1]
R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# 标定分辨率 = live 流分辨率 (2560x1440), 不需要 K 缩放.
width: 2560
height: 1440
resolution: [2560, 1440]
rostopic: "/cam0/image_raw"