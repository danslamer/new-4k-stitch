%YAML:1.0
---
# ============================================================
# v2 阶段输入源描述 (阶段 2 引入). InitVideoCapture 优先读本文件, 加载失败时 fallback 到默认.
# v2.5 (2026-07-08): datasets/2k-test/*.mp4 是 MPEG-4 Visual (mp4v), gst_mpp_decoder pipeline
# 走 qtdemux+h264parse+mppvideodec, mp4v 与 video/x-h264 caps 不匹配 → 绿条纹.
# 修复路径: 板上跑 batch_transcode_to_h264.sh 把 2k-test/*.mp4 转 2k-test-h264/*.mp4 (H.264).
# 本 yaml 的 uri 已固定指 ../datasets/2k-test-h264/, 直接 sed 替换即可.
#
# 字段:
#   type:        file (mipi 待阶段 3 启用 V4L2)
#   uri:         ../datasets/2k-test-h264/tXX.mp4
#   width/height: 期望分辨率, 启动时校验
#   fps:         目标帧率 30
#   pixel_format: NV12 (rkisp_mainpath 输出)
# 顶层:
#   sync_window_ms:  阶段 4 时间戳同步窗口, 默认 16ms
#   auto_calibrate:  阶段 3 启动期自标定, 默认 0
# ============================================================
sync_window_ms: 16
auto_calibrate: 0
cameras:
   - type: file
     uri: ../datasets/2k-test-h264/t50.mp4
     width: 2560
     height: 1440
     fps: 30
     pixel_format: NV12
   - type: file
     uri: ../datasets/2k-test-h264/t51.mp4
     width: 2560
     height: 1440
     fps: 30
     pixel_format: NV12
   - type: file
     uri: ../datasets/2k-test-h264/t52.mp4
     width: 2560
     height: 1440
     fps: 30
     pixel_format: NV12
   - type: file
     uri: ../datasets/2k-test-h264/t53.mp4
     width: 2560
     height: 1440
     fps: 30
     pixel_format: NV12
   - type: file
     uri: ../datasets/2k-test-h264/t40.mp4
     width: 2560
     height: 1440
     fps: 30
     pixel_format: NV12
   - type: file
     uri: ../datasets/2k-test-h264/t41.mp4
     width: 2560
     height: 1440
     fps: 30
     pixel_format: NV12