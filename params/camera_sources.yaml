# ============================================================
# Sprint 4-MIPI (2026-07-15): 6 路 GC4683 MIPI 直连 (RK3576 已验证).
#   历史信息见 docs/HISTORY.md § 2.9 (v4l2-ctl ISP 取流实测, 2026-07-15).
#   **ISP 在 SoC 端 rkisp, GC4683 sensor 本身无 ISP 能力 (厂商口径错误, 见 HISTORY.md § 3
#   "GC4683 没有 built-in ISP" 段). 必须走 rkisp_mainpath 节点, 不是 raw.**
#
# 6 路 /dev/videoN 节点对应 (HISTORY.md § 2.9 表):
#   cam0  <-> /dev/video66    (rkisp_mainpath, gc4683@10)
#   cam1  <-> /dev/video75    (rkisp_mainpath, gc4683_2@31)
#   cam2  <-> /dev/video84    (rkisp_mainpath, gc4683_3@10)
#   cam3  <-> /dev/video93    (rkisp_mainpath, gc4683_4@31; 当前板端 sensor 已拔)
#   cam4  <-> /dev/video102   (rkisp_mainpath, gc4683_5@31)
#   cam5  <-> /dev/video111   (rkisp_mainpath, gc4683_1@31; 当前板端 sensor 已拔)
#
# 注: cam1/cam5 物理 sensor 暂未接 (拔下待换), BlackFrameProvider 自动接 2 路占位.
#     历史探测输出保存在 HISTORY.md § 2.9, 有变更时再跑 probe_v4l2.sh.
#
# 运行 (PC 端先 scp 到板端):
#   bash tools/sprint4_mipi_bootstrap.sh             # 全自动: probe + cmake + make + 启 5s
#   bash tools/sprint4_mipi_bootstrap.sh --probe-only # 仅 probe
#
# 字段 (mipi 专用):
#   device_path:    /dev/videoN rkisp_mainpath 节点 (已经 SoC 端 ISP, NV12 输出)
#   io_mode:        "dmabuf" (零拷贝默认)
#   v4l2_buffer_count: v4l2src 内部 buffer 数 (1..8, 默认 4)
# ============================================================

sync_window_ms: 16
auto_calibrate: 0

cameras:
  # ----- cam0: /dev/video66 (rkisp_mainpath, gc4683@10) -----
  - type: mipi
    device_path: /dev/video66
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    io_mode: dmabuf
    v4l2_buffer_count: 4

  # ----- cam1: /dev/video75 (rkisp_mainpath, gc4683_2@31) -----
  - type: mipi
    device_path: /dev/video75
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    io_mode: dmabuf
    v4l2_buffer_count: 4

  # ----- cam2: /dev/video84 (rkisp_mainpath, gc4683_3@10) -----
  - type: mipi
    device_path: /dev/video84
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    io_mode: dmabuf
    v4l2_buffer_count: 4

  # ----- cam3: /dev/video93 (rkisp_mainpath, gc4683_4@31; ⚠ 当前 sensor 已拔) -----
  # 这路 sensor 物理上是断的, 启动时 v4l2src 会失败, BlackFrameProvider 自动接管 (全黑占位).
  - type: mipi
    device_path: /dev/video93
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    io_mode: dmabuf
    v4l2_buffer_count: 4

  # ----- cam4: /dev/video102 (rkisp_mainpath, gc4683_5@31) -----
  - type: mipi
    device_path: /dev/video102
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    io_mode: dmabuf
    v4l2_buffer_count: 4

  # ----- cam5: /dev/video111 (rkisp_mainpath, gc4683_1@31; ⚠ 当前 sensor 已拔) -----
  - type: mipi
    device_path: /dev/video111
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    io_mode: dmabuf
    v4l2_buffer_count: 4
