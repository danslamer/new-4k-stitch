---
# ============================================================
# v3.0 (2026-07-08): 6 路网络摄像头 (PoE 交换机接入开发板)
#
# 用法:
#   1. 把下面 6 路的 `uri` / `user_id` / `user_pw` 填实
#      (摄像机 web 后台确认 RTSP URL, 海康/大华/雄迈格式不同)
#   2. 板端: export INPUT_SOURCE_MODE=camera
#   3. 跑: bash tools/sprint0_smoke.sh
#
# 字段说明:
#   type             : file | rtsp (file 仅 dev/test 用)
#   uri              : file → ../datasets/2k-test-h264/tXX.mp4
#                      rtsp → rtsp://user:pass@host:port/path
#   width / height   : 2560 × 1440 (2K)
#   fps              : 30
#   pixel_format     : NV12 (mppvideodec 唯一支持格式)
#   user_id / user_pw: rtsp 专用, 空字符串 = 无认证
#   latency_ms       : rtspsrc jitter buffer (80-200)
#   use_tcp          : true (TCP 抗丢) / false (UDP 低延迟)
#   connect_timeout_s: rtspsrc 信令 + TCP connect 超时
#   retry_attempts   : 单路 RTC 失败重试 (默认 5)
#   reconnect_backoff_ms: 断线重连退避
#   frame_drop_threshold: fps / 期望fps 低于此值告警
#
# 顶层:
#   sync_window_ms   : 6 路 PTS 拉齐窗, 默认 16ms (1 帧 @60fps)
#   auto_calibrate   : Sprint 2 启动期自标定, 默认 false
#
# 当前 IP: 6 路 192.168.1.11..16 摄像机, 板端: 192.168.1.10 (set_cam_ips.sh 可一键换)
# ============================================================

sync_window_ms: 16
auto_calibrate: 0

cameras:
  # ----- cam0: 2×3 网格左上 -----
  - type: rtsp
    uri: rtsp://admin:123456@192.168.1.11:554/video1
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    user_id: admin
    user_pw: 123456
    latency_ms: 120
    use_tcp: true
    connect_timeout_s: 10
    retry_attempts: 5
    reconnect_backoff_ms: 2000
    frame_drop_threshold: 0.8

  # ----- cam1: 2×3 网格右上 -----
