%YAML:1.0
---
# ============================================================
# v3.0 (2026-07-08): 6 路网络摄像头 (PoE 交换机接入开发板)
# v3.2 (2026-07-09): 加 output: 块, 启用 2 路 RTSP 推流
# 当前 IP: 6 路 192.168.1.11..16 摄像机, 板端: 192.168.1.10
# ============================================================

sync_window_ms: 16
auto_calibrate: 0

# v3.2 (2026-07-09): 输出 2 路 RTSP 推流
#   /stitch       拼接完成画面 (H.264 HW 编码)
#   /stitch_diff  帧差掩码 (变动的红色高亮 + 矩形框)
output:
  enabled: true
  bind_address: "0.0.0.0"
  port: 8554
  auth_enabled: false
  auth_user: admin
  auth_pass: CHANGE_ME
  on_demand: false
  diff_threshold: 30
  diff_bbox_min_area: 100
  streams:
    - path: /stitch
      width: 0
      height: 0
      fps: 30
      bitrate_kbps: 4000
      encoder: h264_hw
    - path: /stitch_diff
      width: 0
      height: 0
      fps: 30
      bitrate_kbps: 2000
      encoder: h264_hw

cameras:
  - type: rtsp
    uri: "rtsp://admin:123456@192.168.1.11:554/video1"
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    user_id: admin
    user_pw: 123456
    latency_ms: 120
    use_tcp: true
  - type: rtsp
    uri: "rtsp://admin:123456@192.168.1.12:554/video1"
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    user_id: admin
    user_pw: 123456
    latency_ms: 120
    use_tcp: true
  - type: rtsp
    uri: "rtsp://admin:123456@192.168.1.13:554/video1"
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    user_id: admin
    user_pw: 123456
    latency_ms: 120
    use_tcp: true
  - type: rtsp
    uri: "rtsp://admin:123456@192.168.1.14:554/video1"
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    user_id: admin
    user_pw: 123456
    latency_ms: 120
    use_tcp: true
  - type: rtsp
    uri: "rtsp://admin:123456@192.168.1.15:554/video1"
    width: 2560
    height: 1440
    fps: 30
    pixel_format: NV12
    user_id: admin
    user_pw: 123456
    latency_ms: 120
    use_tcp: true
  - type: rtsp
