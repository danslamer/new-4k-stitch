%YAML:1.0
---
# ============================================================
# ROI 调参配置 (params/roi_tuning.yaml)
# ============================================================
# 相机: GC4683 (车载固定云台, 4 路 → 2×3 = 6 路迁移中)
#   HFOV  : 101°      →  2560 px / 101° ≈ 25.35 px/°
#   VFOV  :  68°      →  1440 px /  68° ≈ 21.18 px/°
#   分辨率: 2560×1440
#   相邻重叠: ~20°    →  水平 ~507 px, 垂直 ~424 px
#
# 启动行为 (2026-06-30 改造):
#   默认: USE_ROI_CONFIG=1, 读本文件; 不存在则跑一次 bootstrap 自动生成.
#   车载固定场景: SKIP_BOOTSTRAP=1 显式声明意图, YAML 缺失时仍跑 bootstrap 兜底
#                 (不会因为缺文件而退出).
#
# 字段:
#   offset_x/y : 像素级微调, 通常 ±20 px 内, 由人工目测或 bootstrap 生成
#   crop_*     : 阶段 4 扩展, 留作 2×3 时按硬件 FOV 分配裁剪窗口
#   feather    : 接缝羽化宽度, 必须偶数 (kernel 会除以 2); 16-120 px 常见
#
# 跳某一路 (调试): 把对应 cam 的 offset_x 改很大或留空, 配合后续 enable 字段.
# ============================================================
mode: dataset
step_size: 1
selected_cam: 1
feather:
   enabled: 1
   width: 120
   strength: 2.
save:
   enabled: 0
   interval: 30
cam0:
   offset_x: 0
   offset_y: 0
cam1:
   offset_x: -39
   offset_y: 95
cam2:
   offset_x: 0
   offset_y: 0
cam3:
   offset_x: 0
   offset_y: 0
cam4:
   offset_x: 0
   offset_y: 0
cam5:
   offset_x: 0
   offset_y: 0
